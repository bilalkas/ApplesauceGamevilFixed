name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust for iOS
        run: rustup target add aarch64-apple-ios

      - name: Install tools
        run: brew install ldid cmake

      - name: Download Boost
        run: |
          curl -L https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz -o boost.tar.gz
          mkdir -p vendor/boost
          tar xzf boost.tar.gz -C vendor/boost --strip-components=1

      - name: Build SDL
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Patch WIPI Resource Assertion for Zenonia 3
        run: |
          find . -name "MCknl.m" -exec sed -i '' 's/Assertion failed: (0)/\/\/ Assertion bypassed/g' {} +

      # Lädt den originalen touchHLE-Core herunter, der für den Schalter nötig ist
      - name: Checkout alternative touchHLE Core
        uses: actions/checkout@v4
        with:
          repository: johnny901901901/touchHLE
          ref: ios-core-dylib
          path: touchhle-core-repo
          submodules: recursive

      # Siehe platform/ios/patches/oaknut-code_block.hpp: ohne diesen Patch
      # bekommt nur StikDebug JIT, und TrollStore/AltJIT stirbt beim Spielstart.
      - name: Patch oaknut for TrollStore and AltJIT
        run: |
          sh platform/ios/scripts/patch-oaknut.sh \
            vendor/dynarmic \
            touchhle-core-repo/vendor/dynarmic

      # Baut Applesauce und nutzt die Variable, um BEIDE Cores (HyperHLE & touchHLE) einzubinden
      - name: Build Applesauce
        env:
          TOUCHHLE_CORE_REPO: ${{ github.workspace }}/touchhle-core-repo
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package IPA
        run: |
          sh platform/ios/scripts/package-ipa.sh

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-iOS-Build
          path: "**/*.ipa"
